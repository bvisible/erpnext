# //// Neoffice — added file (no upstream equivalent).
#
# Until 2026-09-08 this fork had 25 commits in fourteen days and ZERO test classes of its
# own (#270), several of them on the path money takes. `tests.yml` next to this file runs
# erpnext's WHOLE suite and is workflow_dispatch only, because that suite takes hours.
# This one runs OUR classes only.
#
# Why not "on every push", the way the frappe fork's Tests workflow runs:
# erpnext's before_tests builds a Company, a Fiscal Year and the rest before a single
# assertion, so a run here is ~10 min against frappe's measured 2.6 — roughly 11 $/month
# on this repo alone, against a 20 $/month budget for everything. Measured, not guessed.
#
# So it fires on the PATHS it actually covers: change the subscription billing gate or the
# quotation expiry job and you get the signal; change anything else and you pay nothing.
# Add a test elsewhere, add its path here — the list is the coverage, in one place.
name: Fork tests
on:
  push:
    branches: [version-15]
    paths:
      - "erpnext/accounts/doctype/subscription/**"
      - "erpnext/selling/doctype/quotation/**"
      # //// Neoffice — the security fixes taken from upstream ahead of the merge (neoffice-maintenance#1748)
      - "erpnext/tests/test_neoffice_security_backports.py"
      - "erpnext/crm/frappe_crm_api.py"
      - "erpnext/crm/doctype/appointment/**"
      - "erpnext/accounts/doctype/cheque_print_template/**"
      - "erpnext/accounts/doctype/payment_request/**"
      # //// Neoffice — the portal login hook that assigns a shopper Customer (neoffice-maintenance#1756)
      - "erpnext/portal/**"
      - "erpnext/accounts/doctype/budget/**"
      - "erpnext/accounts/doctype/journal_entry/**"
      - "erpnext/accounts/doctype/opening_invoice_creation_tool/**"
      - "erpnext/accounts/doctype/payment_entry/**"
      - "erpnext/accounts/report/inactive_sales_items/**"
      - "erpnext/bulk_transaction/**"
      - "erpnext/controllers/status_updater.py"
      - "erpnext/controllers/website_list_for_contact.py"
      - "erpnext/crm/report/lost_opportunity/**"
      - "erpnext/edi/doctype/code_list/**"
      - "erpnext/manufacturing/doctype/workstation/**"
      - "erpnext/selling/report/inactive_customers/**"
      - "erpnext/selling/report/sales_analytics/**"
      - "erpnext/setup/doctype/authorization_control/**"
      - "erpnext/stock/doctype/material_request/**"
      - "erpnext/stock/stock_balance.py"
      - ".github/workflows/fork-tests.yml"
  pull_request:
    paths:
      - "erpnext/accounts/doctype/subscription/**"
      - "erpnext/selling/doctype/quotation/**"
      - "erpnext/tests/test_neoffice_security_backports.py"
      - "erpnext/crm/frappe_crm_api.py"
      - "erpnext/crm/doctype/appointment/**"
      - "erpnext/accounts/doctype/cheque_print_template/**"
      - "erpnext/accounts/doctype/payment_request/**"
      # //// Neoffice — the portal login hook that assigns a shopper Customer (neoffice-maintenance#1756)
      - "erpnext/portal/**"
      - "erpnext/accounts/doctype/budget/**"
      - "erpnext/accounts/doctype/journal_entry/**"
      - "erpnext/accounts/doctype/opening_invoice_creation_tool/**"
      - "erpnext/accounts/doctype/payment_entry/**"
      - "erpnext/accounts/report/inactive_sales_items/**"
      - "erpnext/bulk_transaction/**"
      - "erpnext/controllers/status_updater.py"
      - "erpnext/controllers/website_list_for_contact.py"
      - "erpnext/crm/report/lost_opportunity/**"
      - "erpnext/edi/doctype/code_list/**"
      - "erpnext/manufacturing/doctype/workstation/**"
      - "erpnext/selling/report/inactive_customers/**"
      - "erpnext/selling/report/sales_analytics/**"
      - "erpnext/setup/doctype/authorization_control/**"
      - "erpnext/stock/doctype/material_request/**"
      - "erpnext/stock/stock_balance.py"
  workflow_dispatch:

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

# ONE JOB PER MODULE, on purpose: `bench run-tests --module A --module B` keeps only the
# LAST one and says nothing about the others — a silent way to test a fraction of what you
# listed. A second module therefore gets a second job, never a second --module.
jobs:
  subscription:
    name: subscription — the gate that bills
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      erpnext_bootstrap: false # erpnext IS the app under test: its own before_tests runs
      skip_build: true # no app build: erpnext ships no SPA
      build_frappe_assets: true # a test that queues an e-mail inlines CSS through assets.json
      test_args: "--module erpnext.accounts.doctype.subscription.test_subscription_neoffice"
    secrets: inherit

  # //// Neoffice — the catch-up of a subscription that fell behind and the end date on the last day of its first period
  # //// (neoffice-maintenance#1556, #1500): real invoices, made and rolled back, so a job of its own.
  subscription_catch_up:
    name: subscription — the catch-up and the end date
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      erpnext_bootstrap: false
      skip_build: true
      build_frappe_assets: true
      test_args: "--module erpnext.accounts.doctype.subscription.test_subscription_catch_up"
    secrets: inherit

  quotation:
    name: quotation — the expiry job and a signed offer
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      erpnext_bootstrap: false
      skip_build: true
      build_frappe_assets: true
      test_args: "--module erpnext.selling.doctype.quotation.test_quotation_neoffice"
    secrets: inherit

  # //// Neoffice — the security fixes taken from upstream version-15 ahead of the full merge (neoffice-maintenance#1748):
  # //// each test fails on the code before its fix.
  security_backports:
    name: security — upstream fixes taken ahead of the merge
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      erpnext_bootstrap: false
      skip_build: true
      build_frappe_assets: true
      test_args: "--module erpnext.tests.test_neoffice_security_backports"
    secrets: inherit

  # //// Neoffice — two homonyms must get separate Customers; the portal login hook must not merge them (neoffice-maintenance#1756)
  portal_homonyms:
    name: portal — homonyms get separate customers
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      erpnext_bootstrap: false
      skip_build: true
      build_frappe_assets: true
      # //// Neoffice — the portal hook reads Webshop Settings (owned by webshop); install it so the test runs the real path (neoffice-maintenance#1756)
      install_apps: webshop
      test_args: "--module erpnext.portal.test_portal_homonyms_get_separate_customers"
    secrets: inherit

  # //// Neoffice — the upstream tests of the modules whose SQL was hardened ahead of the merge (neoffice-maintenance#1748).
  # //// They need ERPNext's own test records, which a copy of a production site does not have: a fresh site runs them.
  sql_backports:
    name: sql fixes — ${{ matrix.args }}
    strategy:
      fail-fast: false
      matrix:
        # `--doctype` loads the test records of the doctype and of everything it links to (`_Test Company`…); `--module`
        # does not, so the report's test declares its own test_dependencies.
        args:
          - '--module erpnext.selling.report.inactive_customers.test_inactive_customers'
          - '--doctype "Opening Invoice Creation Tool"'
          - '--doctype "Budget"'
          - '--doctype "Journal Entry"'
          - '--doctype "Material Request"'
          - '--doctype "Sales Order"'
          - '--doctype "Payment Entry"'
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: erpnext
      # the test records of Journal Entry, Sales Order… link to Payment Gateway, a doctype of the payments app
      install_apps: payments
      erpnext_bootstrap: false
      skip_build: true
      build_frappe_assets: true
      test_args: ${{ matrix.args }}
    secrets: inherit
